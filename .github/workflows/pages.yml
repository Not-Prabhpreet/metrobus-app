name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Monday, 09:17 UTC. Refresh and redeploy even when app source is unchanged.
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: /metrobus-app/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - name: Download and validate the latest official schedule
        run: npm run data:refresh
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Retain the exact feed used for this deployment
        uses: actions/upload-artifact@v4
        with:
          name: schedule-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/google_transit.zip
            data/source.json
          retention-days: 90
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish app
        id: deployment
        uses: actions/deploy-pages@v4
